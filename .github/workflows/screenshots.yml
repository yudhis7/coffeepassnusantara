name: Perbarui screenshot user guide

# Menjalankan alur aplikasi dengan Playwright (dengan peta asli) lalu menyimpan
# hasilnya ke docs/images agar docs/USER_GUIDE.md selalu sesuai tampilan terbaru.
on:
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/scripts/screenshots.mjs'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Chromium + fonts
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-inter || true
      - name: Build and capture
        working-directory: app
        run: |
          npm run build
          npm run screenshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan screenshot."
          else
            git commit -m "docs: perbarui screenshot user guide [skip ci]"
            git pull --rebase origin main
            git push
          fi
